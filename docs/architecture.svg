<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="882" viewBox="0 0 1040 882"><rect width="1040" height="882" fill="#fff"/><text x="40" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#2b2b2b" font-weight="normal" text-anchor="start">J24 In-Store Screen Ads — Backend Architecture</text><rect x="40" y="85" width="960" height="125" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="52" y="76" width="69.19999999999999" height="18" fill="#fff"/><text x="60" y="89" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#e8590c" font-weight="bold" text-anchor="start">CLIENTS</text><rect x="60.0" y="107" width="293.3333333333333" height="84" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="72.0" y="129" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Owner Console</text><text x="72.0" y="147" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">store owner (web)</text><text x="72.0" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">buy credits, add TVs,</text><text x="72.0" y="177" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">create / pause / cancel ad</text><rect x="373.3333333333333" y="107" width="293.3333333333333" height="84" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="385.3333333333333" y="129" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">TV (J24 SDK)</text><text x="385.3333333333333" y="147" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">one per TV in the store</text><text x="385.3333333333333" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">sync every 5 min, play by clock,</text><text x="385.3333333333333" y="177" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">3-day offline cache + play-log queue</text><rect x="686.6666666666666" y="107" width="293.3333333333333" height="84" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="698.6666666666666" y="129" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">J24 Ops</text><text x="698.6666666666666" y="147" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">internal</text><text x="698.6666666666666" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">screen alerts,</text><text x="698.6666666666666" y="177" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">run settlement now</text><line x1="520.0" y1="210" x2="520.0" y2="242" stroke="#2b2b2b" stroke-width="1.6"/><polygon points="514.0,241 526.0,241 520.0,250" fill="#2b2b2b"/><rect x="40" y="255" width="960" height="190" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="52" y="246" width="130.0" height="18" fill="#fff"/><text x="60" y="259" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#e8590c" font-weight="bold" text-anchor="start">APIS  (/api/v1)</text><rect x="60.0" y="277" width="450.0" height="68" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="72.0" y="299" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Store &amp; Screen APIs</text><text x="72.0" y="317" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">POST /stores · GET /stores · POST /stores/{id}/screens ·</text><text x="72.0" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">GET /stores/{id}/screens · PATCH /screens/{id}</text><rect x="530.0" y="277" width="450.0" height="68" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="542.0" y="299" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Credit APIs</text><text x="542.0" y="317" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">POST /stores/{id}/credits/purchase · GET /stores/{id}/wallet ·</text><text x="542.0" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">GET /stores/{id}/wallet/transactions</text><rect x="60.0" y="357" width="450.0" height="68" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="72.0" y="379" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Ad APIs</text><text x="72.0" y="397" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">POST /ads/availability · POST /ads · POST /ads/{id}/pause|resume|cancel ·</text><text x="72.0" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">GET /ads?storeId= · GET /ads/{id} · GET /ads/{id}/image</text><rect x="530.0" y="357" width="450.0" height="68" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="542.0" y="379" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Ad Server &amp; Ops APIs</text><text x="542.0" y="397" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">POST /screens/{id}/sync — upload plays, get 3-day playlist ·</text><text x="542.0" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">POST /ops/settlement/run · GET /ops/alerts</text><line x1="520.0" y1="445" x2="520.0" y2="477" stroke="#e8590c" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="514.0,476 526.0,476 520.0,485" fill="#e8590c"/><rect x="40" y="490" width="960" height="205" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="52" y="481" width="494.79999999999995" height="18" fill="#fff"/><text x="60" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#e8590c" font-weight="bold" text-anchor="start">BACKEND SERVICE  (one Spring Boot app, one package per service)</text><rect x="60.0" y="512" width="293.3333333333333" height="76" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="72.0" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Store Manager</text><text x="72.0" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">onboard store</text><text x="72.0" y="567" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">+ create empty wallet</text><rect x="373.3333333333333" y="512" width="293.3333333333333" height="76" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="385.3333333333333" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Screen Manager</text><text x="385.3333333333333" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">register TVs · status · last seen</text><text x="385.3333333333333" y="567" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">book / free slots (slot_booking)</text><rect x="686.6666666666666" y="512" width="293.3333333333333" height="76" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="698.6666666666666" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Ad Manager</text><text x="698.6666666666666" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">availability · publish (one txn)</text><text x="698.6666666666666" y="567" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">pause · resume · cancel</text><rect x="60.0" y="600" width="293.3333333333333" height="76" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="72.0" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Credit Manager</text><text x="72.0" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">purchase (mock gateway)</text><text x="72.0" y="655" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">hold · deduct · release · daily billing</text><rect x="373.3333333333333" y="600" width="293.3333333333333" height="76" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="385.3333333333333" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Ad Server</text><text x="385.3333333333333" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">sync → full 3-day playlist</text><text x="385.3333333333333" y="655" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">save play logs once (play_id PK)</text><rect x="686.6666666666666" y="600" width="293.3333333333333" height="76" rx="12" fill="#f7f4ec" stroke="#2b2b2b" stroke-width="1.3"/><text x="698.6666666666666" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2b2b2b" font-weight="normal" text-anchor="start">Jobs  (every minute)</text><text x="698.6666666666666" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">settlement: charge aired, return rest</text><text x="698.6666666666666" y="655" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">screen health: alert after 10 min</text><line x1="520.0" y1="695" x2="520.0" y2="727" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="514.0,726 526.0,726 520.0,735" fill="#555"/><text x="532.0" y="719.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#555" font-weight="normal" text-anchor="start">SQL · reads / writes</text><rect x="40" y="740" width="960" height="112" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="52" y="731" width="183.2" height="18" fill="#fff"/><text x="60" y="744" font-family="Helvetica Neue, Helvetica, Arial, sans-seri